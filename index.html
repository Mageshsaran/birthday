  /* ==========================================================
     Scratch-to-reveal card
     ========================================================== */
  const scratch = {
    canvas: null,
    ctx: null,
    card: null,
    revealed: false,
    drawing: false,
    last: null,
    checkTimer: null,

    init: function () {
      this.canvas = $('#scratchCanvas');
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d');
      this.card = $('#scratchCard');
      this.bind();
      $('#scratchReset').addEventListener('click', () => this.reset());
      this.draw();
    },

    draw: function () {
      const canvas = this.canvas;
      const ctx = this.ctx;
      const rect = this.card.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      this.revealed = false;
      canvas.classList.remove('revealed');
      canvas.style.pointerEvents = '';
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const gradient = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      gradient.addColorStop(0, '#ff87b7');
      gradient.addColorStop(0.5, '#b388ff');
      gradient.addColorStop(1, '#ffc861');
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = 'rgba(255,255,255,.38)';
      for (let i = 0; i < 46; i++) {
        const x = Math.random() * rect.width;
        const y = Math.random() * rect.height;
        const r = Math.random() * 1.8 + 0.6;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(45,20,60,.38)';
      ctx.font = '700 12px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const scratchCta = BD.fillName(copyValue('scratchCta', 'SCRATCH HERE'), state.cfg.general.name || 'you');
      ctx.fillText(scratchCta, rect.width / 2, rect.height / 2 - 12);
      const cx = rect.width / 2;
      const cy = rect.height / 2 + 22;
      const r = 12;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.quadraticCurveTo(cx + 2, cy - 2, cx + r, cy);
      ctx.quadraticCurveTo(cx + 2, cy + 2, cx, cy + r);
      ctx.quadraticCurveTo(cx - 2, cy + 2, cx - r, cy);
      ctx.quadraticCurveTo(cx - 2, cy - 2, cx, cy - r);
      ctx.fill();
    },

    bind: function () {
      const canvas = this.canvas;
      const self = this;

      const down = (event) => {
        if (self.revealed) return;
        event.preventDefault();
        self.drawing = true;
        self.last = null;
        try { canvas.setPointerCapture(event.pointerId); } catch (err) { /* ignore */ }
        self.paint(event);
      };

      const move = (event) => {
        if (!self.drawing || self.revealed) return;
        event.preventDefault();
        self.paint(event);
      };

      const up = () => {
        if (!self.drawing) return;
        self.drawing = false;
        self.last = null;
        self.check();
      };

      canvas.addEventListener('pointerdown', down, { passive: false });
      canvas.addEventListener('pointermove', move, { passive: false });
      canvas.addEventListener('pointerup', up);
      canvas.addEventListener('pointercancel', up);
      canvas.addEventListener('pointerleave', () => {
        if (self.drawing) self.check();
      });
    },

    paint: function (event) {
      const ctx = this.ctx;
      const rect = this.card.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.fillStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = 46;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (this.last) {
        ctx.beginPath();
        ctx.moveTo(this.last.x, this.last.y);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(x, y, 23, 0, Math.PI * 2);
      ctx.fill();
      this.last = { x: x, y: y };

      if (!this.checkTimer) {
        const self = this;
        this.checkTimer = setTimeout(() => {
          self.checkTimer = null;
          self.check();
        }, 160);
      }
    },

    check: function () {
      if (this.revealed) return;
      let pixels;
      try {
        pixels = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height).data;
      } catch (err) {
        return;
      }
      let clear = 0;
      let total = 0;
      for (let i = 3; i < pixels.length; i += 4 * 97) {
        total++;
        if (pixels[i] < 40) clear++;
      }
      if (total && clear / total > 0.48) this.reveal();
    },

    reveal: function () {
      if (this.revealed) return;
      this.revealed = true;
      this.drawing = false;
      this.canvas.classList.add('revealed');
      this.canvas.style.pointerEvents = 'none';
      const rect = this.card.getBoundingClientRect();
      FX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, confettiCount(80), { power: 11, gravity: 0.15 });
      SOUND.chime();
    },

    reset: function () {
      this.draw();
    }
  };

  /* ==========================================================
     Music — uploaded songs, or a synthesized melody fallback
     ========================================================== */
  const music = {
    audio: null,
    tracks: [],
    index: 0,
    playing: false,
    enabled: true,
    ctx: null,
    master: null,
    synthTimer: null,
    nodes: [],

    init: async function () {
      this.enabled = !!(state.cfg.settings && state.cfg.settings.music);
      const button = $('#musicBtn');
      if (!this.enabled) {
        button.hidden = true;
        return;
      }
      button.hidden = false;

      const songs = state.cfg.media.songs || [];
      for (const song of songs) {
        const url = await BD.mediaEntryURL(song, state.mediaBase);
        if (url) this.tracks.push({ id: song.id, url: url, title: song.title || '' });
      }

      if (this.tracks.length) {
        const active = this.tracks.findIndex((track) => track.id === state.cfg.media.activeSongId);
        this.index = active >= 0 ? active : 0;
        this.audio = new Audio();
        this.audio.preload = 'auto';
        this.audio.volume = 0.55;
        this.audio.src = this.tracks[this.index].url;
        this.audio.loop = this.tracks.length === 1;
        this.audio.addEventListener('ended', () => {
          if (this.tracks.length > 1) this.next();
        });
      }

      button.addEventListener('click', () => this.toggle());
      this.render();
    },

    play: async function () {
      if (!this.enabled) return;
      if (this.tracks.length && this.audio) {
        try {
          await this.audio.play();
          this.playing = true;
        } catch (err) {
          this.playing = false;
        }
      } else {
        this.startSynth();
        this.playing = true;
      }
      this.render();
    },

    pause: function () {
      if (this.audio) this.audio.pause();
      this.stopSynth();
      this.playing = false;
      this.render();
    },

    toggle: function () {
      if (this.playing) this.pause();
      else this.play();
    },

    next: function () {
      if (!this.tracks.length) return;
      this.index = (this.index + 1) % this.tracks.length;
      this.audio.src = this.tracks[this.index].url;
      if (this.playing) this.audio.play().catch(() => {});
    },

    render: function () {
      const button = $('#musicBtn');
      button.classList.toggle('playing', this.playing);
      const label = this.playing ? 'Pause music' : 'Play music';
      button.setAttribute('aria-label', label);
      button.title = label;
    },

    startSynth: function () {
      try {
        if (!this.ctx) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return;
          this.ctx = new AudioCtor();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.16;
          this.master.connect(this.ctx.destination);
        }
        this.ctx.resume().catch(() => {});
        this.stopSynth();

        const ctx = this.ctx;
        const master = this.master;
        const beat = 0.5;
        const N = {
          G4: 392.0, A4: 440.0, B4: 493.88, C5: 523.25,
          D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
        };
        const melody = [
          { f: N.G4, s: 0, d: 0.75 }, { f: N.G4, s: 0.75, d: 0.25 },
          { f: N.A4, s: 1, d: 1 }, { f: N.G4, s: 2, d: 1 },
          { f: N.C5, s: 3, d: 1 }, { f: N.B4, s: 4, d: 2 },
          { f: N.G4, s: 6, d: 0.75 }, { f: N.G4, s: 6.75, d: 0.25 },
          { f: N.A4, s: 7, d: 1 }, { f: N.G4, s: 8, d: 1 },
          { f: N.D5, s: 9, d: 1 }, { f: N.C5, s: 10, d: 2 },
          { f: N.G4, s: 12, d: 0.75 }, { f: N.G4, s: 12.75, d: 0.25 },
          { f: N.G5, s: 13, d: 1 }, { f: N.E5, s: 14, d: 1 },
          { f: N.C5, s: 15, d: 1 }, { f: N.B4, s: 16, d: 1 },
          { f: N.A4, s: 17, d: 2 },
          { f: N.F5, s: 19, d: 0.75 }, { f: N.F5, s: 19.75, d: 0.25 },
          { f: N.E5, s: 20, d: 1 }, { f: N.C5, s: 21, d: 1 },
          { f: N.D5, s: 22, d: 1 }, { f: N.C5, s: 23, d: 2 }
        ];

        const start = ctx.currentTime + 0.08;
        let end = 0;
        melody.forEach((note) => {
          const when = start + note.s * beat;
          const duration = note.d * beat;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = note.f;
          gain.gain.setValueAtTime(0, when);
          gain.gain.linearRampToValueAtTime(0.12, when + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, when + duration * 0.95);
          osc.connect(gain).connect(master);
          osc.start(when);
          osc.stop(when + duration + 0.05);
          this.nodes.push(osc);
          end = Math.max(end, note.s + note.d);
        });

        const total = end * beat;
        this.synthTimer = setTimeout(() => {
          if (this.playing) this.startSynth();
        }, Math.ceil((total + 0.4) * 1000));
      } catch (err) {
        /* audio is a nice-to-have */
      }
    },

    stopSynth: function () {
      clearTimeout(this.synthTimer);
      this.synthTimer = null;
      this.nodes.forEach((node) => {
        try { node.stop(); } catch (err) { /* ignore */ }
      });
      this.nodes = [];
    }
  };

  /* ==========================================================
     Finale fireworks
     ========================================================== */
  let fireworksTimer = null;
  let fireworkStartTimer = null;

  function startFireworks() {
    stopFireworks();
    if (reduceMotion.matches) return;
    const fire = () => {
      const x = window.innerWidth * (0.14 + Math.random() * 0.72);
      const y = window.innerHeight * (0.12 + Math.random() * 0.34);
      FX.burst(x, y, confettiCount(72), { power: 13, gravity: 0.12 });
    };
    fire();
    fireworkStartTimer = setTimeout(fire, 380);
    fireworksTimer = setInterval(fire, 1250);
  }

  function stopFireworks() {
    clearInterval(fireworksTimer);
    clearTimeout(fireworkStartTimer);
    fireworksTimer = null;
    fireworkStartTimer = null;
  }

  /* ==========================================================
     Navigation
     ========================================================== */
  function buildDots() {
    const dots = $('#dots');
    dots.textContent = '';
    state.sceneIds.forEach((id, index) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot';
      const label = SCENE_MAP[id] ? SCENE_MAP[id].label : 'Page ' + (index + 1);
      dot.title = label;
      dot.dataset.label = label;
      dot.setAttribute('aria-label', 'Go to ' + label);
      dot.addEventListener('click', () => goTo(index));
      dots.appendChild(dot);
    });
  }

  function updateNav() {
    const total = state.sceneIds.length;
    const sceneId = state.sceneIds[state.current] || '';
    const label = SCENE_MAP[sceneId] ? SCENE_MAP[sceneId].label : 'Page ' + (state.current + 1);
    const page = state.current + 1;

    $('#prevBtn').disabled = state.current <= 0;
    $('#nextBtn').disabled = state.current >= total - 1;
    $$('#dots .dot').forEach((dot, index) => {
      dot.classList.toggle('active', index === state.current);
      if (index === state.current) dot.setAttribute('aria-current', 'page');
      else dot.removeAttribute('aria-current');
    });

    const progress = total <= 1 ? 100 : (state.current / (total - 1)) * 100;
    const progressFill = $('#navProgressFill');
    if (progressFill) progressFill.style.width = progress + '%';
    const navCount = $('#navCount');
    if (navCount) navCount.textContent = String(page).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
    const chapterNum = $('#chapterNum');
    if (chapterNum) chapterNum.textContent = String(page).padStart(2, '0');
    const chapterLabel = $('#chapterLabel');
    if (chapterLabel) chapterLabel.textContent = label;
    const chapterPill = $('#chapterPill');
    if (chapterPill) {
      chapterPill.classList.remove('is-swapping');
      void chapterPill.offsetWidth;
      chapterPill.classList.add('is-swapping');
    }
    const navbar = $('#navbar');
    if (navbar) navbar.setAttribute('aria-label', 'Page navigation — ' + label + ', page ' + page + ' of ' + total);
    document.body.dataset.scene = sceneId;
  }

  function goTo(index, options) {
    const opts = options || {};
    if (!Number.isFinite(index) || index < 0 || index >= state.sceneIds.length) return;
    if (index === state.current && !opts.initial) return;

    const previousIndex = state.current;
    const previous = state.current >= 0 ? state.sceneIds[state.current] : null;
    if (previous && !opts.initial) leaveScene(previous);

    state.current = index;
    const sceneId = state.sceneIds[index];
    $$('.scene').forEach((scene) => {
      scene.classList.remove('active');
      scene.setAttribute('aria-hidden', 'true');
    });
    const sceneEl = document.getElementById('scene-' + sceneId);
    if (sceneEl) {
      const forward = previousIndex < 0 || index >= previousIndex;
      sceneEl.style.setProperty('--enter-x', (forward ? 34 : -34) + 'px');
      sceneEl.classList.add('active');
      sceneEl.removeAttribute('aria-hidden');
      sceneEl.scrollTop = 0;
    }

    updateNav();
    enterScene(sceneId);
    scheduleAuto();
    try {
      history.replaceState(null, '', '#' + sceneId);
    } catch (err) {
      /* file:// quirks are fine */
    }
  }

  function enterScene(id) {
    if (id === 'hero') animateHero();
    else if (id === 'letter') letterUI.start();
    else if (id === 'finale') startFireworks();
    else if (id === 'balloons' && !$('#balloonField').children.length) balloons.build();
  }

  function leaveScene(id) {
    if (id === 'cake') cake.leave();
    else if (id === 'videos') pauseVideos();
    else if (id === 'finale') stopFireworks();
    else if (id === 'letter') letterUI.stopHearts();
  }

  let autoTimer = null;

  function scheduleAuto() {
    clearTimeout(autoTimer);
    const seconds = Number(state.cfg.settings.autoAdvance) || 0;
    if (!seconds) return;
    autoTimer = setTimeout(() => {
      if (state.current < state.sceneIds.length - 1) goTo(state.current + 1);
    }, seconds * 1000);
  }

  function setupNav() {
    $('#prevBtn').addEventListener('click', () => goTo(state.current - 1));
    $('#nextBtn').addEventListener('click', () => goTo(state.current + 1));
    $$('[data-next]').forEach((button) => {
      button.addEventListener('click', () => goTo(state.current + 1));
    });
    document.addEventListener('keydown', onKeyDown);
    setupSwipe();
  }

  function onKeyDown(event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target && event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (event.key === 'ArrowRight' || event.key === 'PageDown') {
      event.preventDefault();
      goTo(state.current + 1);
    } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      event.preventDefault();
      goTo(state.current - 1);
    } else if (event.key === 'Home') {
      event.preventDefault();
      goTo(0);
    } else if (event.key === 'End') {
      event.preventDefault();
      goTo(state.sceneIds.length - 1);
    } else if (event.key === 'b' || event.key === 'B') {
      if (state.cfg.scenes.easterEgg) balloonShower();
    } else if (event.key === 'm' || event.key === 'M') {
      if (music.enabled) music.toggle();
    }
  }

  function setupSwipe() {
    let startX = null;
    let startY = null;
    document.addEventListener('touchstart', (event) => {
      if (event.touches.length !== 1) return;
      const target = event.target;
      if (target.closest && target.closest('canvas, video, .scratch-card, input, textarea, select')) {
        startX = null;
        return;
      }
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (event) => {
      if (startX === null) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      startX = null;
      if (Math.abs(dx) > 65 && Math.abs(dy) < 60) {
        goTo(state.current + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });
  }

  /* ==========================================================
     Gift, finale, copy
     ========================================================== */
  function setupGift() {
    const giftBox = $('#giftBox');
    giftBox.addEventListener('click', () => {
      if (state.giftOpened) return;
      state.giftOpened = true;
      giftBox.classList.add('open');
      giftBox.setAttribute('aria-label', 'Your gift is open');

      const rect = giftBox.getBoundingClientRect();
      FX.burst(rect.left + rect.width / 2, rect.top + rect.height * 0.35, confettiCount(130), { power: 15, gravity: 0.16 });
      setTimeout(() => {
        FX.burst(window.innerWidth * 0.1, window.innerHeight * 0.72, confettiCount(60), { power: 12, angle: -Math.PI / 3, spread: 1 });
        FX.burst(window.innerWidth * 0.9, window.innerHeight * 0.72, confettiCount(60), { power: 12, angle: -Math.PI * 2 / 3, spread: 1 });
      }, 220);

      SOUND.chime();
      $('#giftHint').textContent = state.cfg.general.giftOpened || 'Best. Day. Ever.';
      $('#giftNext').hidden = false;
      if (music.enabled) music.play();
    });
    $('#giftNext').addEventListener('click', () => goTo(state.current + 1));
  }

  function setupFinale() {
    $('#replayBtn').addEventListener('click', () => resetExperience());
    $('#copyBtn').addEventListener('click', () => copyLink());
  }

  async function copyLink() {
    const url = location.href;
    try {
      await navigator.clipboard.writeText(url);
      toast('Link copied!');
    } catch (err) {
      const area = document.createElement('textarea');
      area.value = url;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      try {
        document.execCommand('copy');
        toast('Link copied!');
      } catch (error) {
        toast('Copy failed — select the address bar instead.');
      }
      area.remove();
    }
  }

  function resetExperience() {
    state.giftOpened = false;
    $('#giftBox').classList.remove('open');
    $('#giftBox').setAttribute('aria-label', 'Open your gift');
    $('#giftHint').textContent = state.cfg.general.giftHint || 'Tap the box to open it';
    $('#giftNext').hidden = true;
    cake.reset();
    balloons.build();
    buildGifts();
    scratch.reset();
    letterUI.reset();
    goTo(0);
  }

  /* ==========================================================
     Surprises: confetti clicks, cursor sparks, easter egg
     ========================================================== */
  function balloonShower() {
    const palette = [340, 300, 270, 200, 160, 40, 120];
    for (let i = 0; i < 16; i++) {
      const balloon = document.createElement('span');
      balloon.className = 'shower-balloon';
      balloon.style.left = (Math.random() * 96 + 2) + '%';
      balloon.style.setProperty('--h', palette[i % palette.length] + Math.round(Math.random() * 20 - 10));
      balloon.style.setProperty('--dur', (3 + Math.random() * 2.4).toFixed(2) + 's');
      balloon.style.setProperty('--delay', (Math.random() * 0.8).toFixed(2) + 's');
      document.body.appendChild(balloon);
      setTimeout(() => balloon.remove(), 7000);
    }
    toast('Surprise!');
    SOUND.sparkle();
  }

  function setupEffects() {
    document.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      FX.burst(event.clientX, event.clientY, confettiCount(20), { power: 6, gravity: 0.2 });
      if (!reduceMotion.matches) {
        const ring = document.createElement('span');
        ring.className = 'click-ring';
        ring.style.left = event.clientX + 'px';
        ring.style.top = event.clientY + 'px';
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 760);
      }
      if (autoTimer) scheduleAuto();
    });

    const glow = $('#cursorGlow');
    if (glow && window.matchMedia('(pointer: fine)').matches && !reduceMotion.matches) {
      document.body.classList.add('has-cursor-glow');
      let glowX = 0;
      let glowY = 0;
      let glowFrame = null;
      const paintGlow = () => {
        glow.style.transform = 'translate3d(' + (glowX - 180) + 'px,' + (glowY - 180) + 'px,0)';
        glowFrame = null;
      };
      document.addEventListener('pointermove', (event) => {
        if (event.pointerType !== 'mouse') return;
        glowX = event.clientX;
        glowY = event.clientY;
        if (!glowFrame) glowFrame = requestAnimationFrame(paintGlow);
      }, { passive: true });
    }

    let lastSpark = 0;
    document.addEventListener('pointermove', (event) => {
      if (!state.cfg.settings.cursorSparkles || reduceMotion.matches) return;
      if (event.pointerType !== 'mouse') return;
      const now = performance.now();
      if (now - lastSpark < 60) return;
      lastSpark = now;
      const spark = document.createElement('span');
      spark.className = 'cursor-spark';
      spark.style.left = event.clientX + 'px';
      spark.style.top = event.clientY + 'px';
      spark.style.color = Math.random() < 0.5 ? state.cfg.theme.accent : '#ffd166';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 950);
    });

    window.addEventListener('resize', () => {
      if (state.current >= 0 && state.sceneIds[state.current] === 'hero') animateHero();
    });
  }

  /* ==========================================================
     Boot
     ========================================================== */
  async function boot() {
    let cfg = null;
    try {
      const published = await BD.loadPublishedConfig();
      if (published) {
        cfg = published.config;
        state.mediaBase = published.mediaBase;
      } else {
        cfg = await BD.getConfig();
      }
    } catch (err) {
      cfg = BD.clone(BD.DEFAULT_CONFIG);
    }
    state.cfg = cfg;
    applyTheme(cfg.theme || {});

    if (BD.getVisitorGate(cfg) && !BD.isVisitorUnlocked(cfg)) {
      showVisitorGate(cfg);
      return;
    }
    startExperience(cfg);
  }

  function showVisitorGate(cfg) {
    const gate = $('#visitorGate');
    const card = $('#gateCard');
    const input = $('#gatePasswordInput');
    const error = $('#gateError');
    const button = $('#gateSubmit');
    const name = String(cfg.general.name || '').trim();

    $('#gateTitle').textContent = name ? 'A surprise for ' + name : 'This one is just for you';
    gate.hidden = false;
    input.value = '';
    error.textContent = '';

    const loader = $('#loader');
    if (loader) {
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 700);
    }
    setTimeout(() => input.focus(), 120);

    $('#gateForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = input.value;
      if (!password) {
        error.textContent = 'Enter the password to continue.';
        input.focus();
        return;
      }
      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Checking…';
      let ok = false;
      try {
        ok = await BD.verifyVisitorPassword(cfg, password);
      } catch (err) {
        error.textContent = 'This browser could not check the password. Try a different browser.';
      } finally {
        button.disabled = false;
        button.textContent = 'Open the surprise';
      }
      if (!ok) {
        if (!error.textContent) error.textContent = 'That password is not right. Try again.';
        input.select();
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        return;
      }
      BD.unlockVisitor(cfg);
      gate.hidden = true;
      startExperience(cfg);
    });
  }

  async function startExperience(cfg) {
    if (state.started) return;
    state.started = true;

    applyTheme(cfg.theme || {});
    applyCopy();
    const scratchSecret = $('#scratchSecret');
    if (scratchSecret) {
      scratchSecret.textContent = BD.fillName(cfg.scenes.scratchSecret || '', cfg.general.name || 'you');
    }
    renderHeroTitle();
    spawnFloatBalloons();

    state.sceneIds = (cfg.scenes.order || []).filter((id) => {
      return cfg.scenes.enabled[id] !== false && document.getElementById('scene-' + id);
    });
    BD.SCENES.forEach((scene) => {
      if (cfg.scenes.enabled[scene.id] !== false && state.sceneIds.indexOf(scene.id) === -1 && document.getElementById('scene-' + scene.id)) {
        state.sceneIds.push(scene.id);
      }
    });
    if (!state.sceneIds.length) state.sceneIds = ['hero'];
    $('#navbar').hidden = state.sceneIds.length < 2;

    cake.init();
    scratch.init();
    $('#scratchZone').hidden = cfg.scenes.showScratch === false;
    $('#balloonReset').addEventListener('click', () => balloons.build());
    letterUI.init();
    buildGifts();
    balloons.build();

    await Promise.all([renderPhotos(), renderVideos()]);
    await music.init();

    setupGift();
    setupNav();
    setupFinale();
    setupEffects();
    buildDots();

    document.title = BD.fillName(cfg.general.finaleTitle || 'Happy Birthday!', cfg.general.name);
    if (!cfg.scenes.easterEgg) {
      $$('[data-copy="easterEggHint"]').forEach((el) => { el.hidden = true; });
    }

    const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    const startIndex = state.sceneIds.indexOf(hash);
    goTo(startIndex >= 0 ? startIndex : 0, { initial: true });

    const loader = $('#loader');
    if (loader) {
      requestAnimationFrame(() => loader.classList.add('hidden'));
      setTimeout(() => loader.remove(), 1300);
    }
  }

  boot();
})();
</script>
</body>
